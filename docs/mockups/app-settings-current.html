<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>App Settings — 현재 디자인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  /* src/styles/tokens.ts 그대로 */
  :root {
    --app: #121116;
    --card: #1C1B22;
    --sunken: #15141A;
    --raised: #24232B;
    --accent: #FFC93C;
    --on-accent: #17130A;
    --text-primary: #F5F5F5;
    --text-tertiary: #8A8A8E;
    --text-muted: #6E6E74;
    --negative: #F0A0A0;
    --border-subtle: rgba(255,255,255,0.08);
    --r-sm: 9px; --r-md: 12px; --r-xl: 20px;
    --inset-top: 47px;
    --inset-bottom: 34px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px 16px;
    background: #08080a;
    color: var(--text-primary);
    font-family: Pretendard, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:active { opacity: 0.65; }
  svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .note { max-width: 390px; font-size: 12px; line-height: 1.5; color: var(--text-muted); text-align: center; }

  /* 기기 프레임 */
  .phone {
    position: relative;
    width: 390px;
    max-width: 100%;
    height: 844px;
    overflow: hidden;
    border-radius: 44px;
    border: 1px solid var(--border-subtle);
    background: var(--app);
  }
  .scroll {
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    padding: calc(var(--inset-top) + 72px) 12px calc(var(--inset-bottom) + 32px);
  }
  .scroll::-webkit-scrollbar { display: none; }

  /* DetailHeaderOverlay */
  .nav {
    position: absolute;
    top: calc(var(--inset-top) + 8px);
    left: 16px; right: 16px;
    height: 40px;
    display: flex;
    align-items: center;
    pointer-events: none;
  }
  .nav-back {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--card);
    box-shadow: 0 8px 20px rgba(0,0,0,0.45);
    pointer-events: auto;
  }
  .nav-title {
    position: absolute;
    inset: 0 48px;
    display: grid; place-items: center;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.4px;
  }

  .section-label {
    margin-bottom: 12px;
    padding: 0 4px;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.7px;
  }

  .icon-tile {
    width: 40px; height: 40px;
    flex-shrink: 0;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    background: var(--sunken);
    color: var(--accent);
  }
  .copy { flex: 1; min-width: 0; }
  .desc {
    margin-top: 3px;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 17px;
  }

  /* NOVELAI — 토큰 카드 */
  .token-card {
    padding: 16px;
    border-radius: var(--r-xl);
    background: var(--card);
  }
  .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .card-title { font-weight: 600; font-size: 16px; }
  .input-shell {
    height: 52px;
    padding-left: 14px;
    display: flex;
    align-items: center;
    overflow: hidden;
    border-radius: var(--r-md);
    border: 1px solid var(--border-subtle);
    background: var(--sunken);
  }
  .input-shell:focus-within { border-color: var(--accent); }
  .token-input {
    flex: 1; min-width: 0; height: 100%;
    padding: 0; border: 0; outline: 0;
    background: none;
    color: var(--text-primary);
    caret-color: var(--accent);
    font: 500 14px Pretendard, sans-serif;
  }
  .token-input::placeholder { color: var(--text-muted); }
  .visibility { width: 48px; height: 50px; display: grid; place-items: center; color: var(--text-tertiary); }
  .security {
    margin-top: 10px;
    padding: 0 2px;
    display: flex; align-items: center; gap: 6px;
    color: var(--text-muted);
    font-size: 12px; line-height: 17px;
  }

  .save {
    width: 100%; height: 52px;
    margin-top: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600; font-size: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.45);
  }
  .feedback {
    min-height: 20px;
    margin-top: 12px;
    padding: 0 4px;
    display: flex; align-items: center; gap: 6px;
    color: var(--accent);
    font-weight: 500; font-size: 12px; line-height: 17px;
  }
  .feedback.error { color: var(--negative); }
  .feedback[hidden] { display: none; }

  /* GENERATION */
  .generation { margin-top: 36px; }
  .gen-card { overflow: hidden; border-radius: var(--r-xl); background: var(--card); }
  .row { min-height: 72px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
  .row-title { font-weight: 600; font-size: 14px; }

  .batch { padding: 0 16px 16px; display: flex; align-items: center; gap: 14px; }
  .value-box {
    width: 64px; height: 38px;
    flex-shrink: 0;
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    background: var(--sunken);
    color: var(--text-primary);
    text-align: center;
    font: 500 16px Pretendard, sans-serif;
    font-variant-numeric: tabular-nums;
    outline: 0;
  }
  .slider {
    --fill: 0%;
    flex: 1; min-width: 0;
    height: 24px;
    appearance: none; -webkit-appearance: none;
    background: none;
    cursor: pointer;
  }
  .slider::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--accent) var(--fill), var(--sunken) var(--fill));
  }
  .slider::-moz-range-track { height: 6px; border-radius: 3px; background: var(--sunken); }
  .slider::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 24px;
    margin-top: -9px;
    border-radius: 7px;
    background: var(--accent);
  }
  .slider::-moz-range-thumb { width: 14px; height: 24px; border: 0; border-radius: 7px; background: var(--accent); }

  .formats { padding: 3px; display: flex; border-radius: var(--r-md); background: var(--sunken); }
  .format {
    min-width: 56px; height: 34px;
    padding: 0 10px;
    border-radius: var(--r-sm);
    color: var(--text-tertiary);
    font-weight: 600; font-size: 13px;
  }
  .format[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }

  .states { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .states button {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border-subtle);
    color: var(--text-tertiary);
    font-size: 12px;
  }
</style>
</head>
<body>
  <p class="note">AppSettingsScreen.tsx 현재 디자인 (390×844, 다크 전용)</p>

  <div class="phone">
    <div class="scroll">
      <div class="section-label">NOVELAI</div>

      <div class="token-card">
        <div class="card-header">
          <div class="icon-tile">
            <svg width="19" height="19" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4.5"/><path d="M11.5 11.5 20 3m-3 3 2.5 2.5M14 9l2 2"/></svg>
          </div>
          <div class="copy">
            <div class="card-title">API Token</div>
            <div class="desc">이미지 생성과 ANLAS 잔액 조회에 사용됩니다</div>
          </div>
        </div>

        <div class="input-shell">
          <input id="token" class="token-input" type="password" placeholder="NovelAI API token" value="pst-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false" aria-label="NovelAI API 토큰" />
          <button id="visibility" class="visibility" aria-label="토큰 표시">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path id="eye-slash" d="M4 4l16 16"/></svg>
          </button>
        </div>

        <div class="security">
          <svg width="13" height="13" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <span>토큰은 이 기기의 보안 저장소에만 저장됩니다</span>
        </div>
      </div>

      <button id="save" class="save">
        <svg width="19" height="19" viewBox="0 0 24 24" stroke-width="2.2"><path d="M5 12.5 10 17.5 19.5 7"/></svg>
        <span>Save Token</span>
      </button>

      <div id="feedback" class="feedback" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path id="feedback-glyph" d="M8 12.5l2.8 2.8L16 9.5"/></svg>
        <span id="feedback-text"></span>
      </div>

      <div class="generation">
        <div class="section-label">GENERATION</div>
        <div class="gen-card">
          <div class="row">
            <div class="icon-tile">
              <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3.5 21 8l-9 4.5L3 8l9-4.5Z"/><path d="M3 12l9 4.5 9-4.5M3 16l9 4.5 9-4.5"/></svg>
            </div>
            <div class="copy">
              <div class="row-title">Batch Count</div>
              <div class="desc">한 번에 생성할 이미지 수</div>
            </div>
          </div>
          <div class="batch">
            <input id="batch-value" class="value-box" inputmode="numeric" value="4" aria-label="Batch Count 값" />
            <input id="batch" class="slider" type="range" min="1" max="100" step="1" value="4" aria-label="Batch Count" />
          </div>
          <div class="row">
            <div class="icon-tile">
              <svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9.5 9.5"/></svg>
            </div>
            <div class="copy">
              <div class="row-title">Image Format</div>
              <div class="desc">생성 이미지를 저장할 형식</div>
            </div>
            <div class="formats" role="radiogroup">
              <button class="format" role="radio" aria-checked="true">PNG</button>
              <button class="format" role="radio" aria-checked="false">WebP</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="nav">
      <button class="nav-back" aria-label="뒤로">
        <svg width="18" height="18" viewBox="0 0 24 24" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="nav-title" class="nav-title">App Settings</div>
    </div>
  </div>

  <div class="states">
    <button data-feedback="">피드백 없음</button>
    <button data-feedback="success">저장 성공</button>
    <button data-feedback="invalid">유효하지 않은 토큰</button>
    <button data-feedback="empty">빈 입력</button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  // 스크롤 시 타이틀 페이드아웃 (hideCompactTitleOnScroll: 0→72px)
  document.querySelector(".scroll").addEventListener("scroll", (e) => {
    $("nav-title").style.opacity = Math.max(0, 1 - e.target.scrollTop / 72);
  });

  $("visibility").addEventListener("click", () => {
    const visible = $("token").type === "password";
    $("token").type = visible ? "text" : "password";
    $("eye-slash").style.display = visible ? "none" : "";
  });

  const FEEDBACK = {
    success: ["API 토큰을 저장하고 확인했습니다.", false],
    invalid: ["토큰은 저장했지만 유효하지 않습니다.", true],
    empty: ["토큰을 입력해 주세요.", true],
  };
  function showFeedback(key) {
    const entry = FEEDBACK[key];
    $("feedback").hidden = !entry;
    if (!entry) return;
    $("feedback-text").textContent = entry[0];
    $("feedback").classList.toggle("error", entry[1]);
    $("feedback-glyph").setAttribute("d", entry[1] ? "M12 7.5v5.5m0 3.2v.3" : "M8 12.5l2.8 2.8L16 9.5");
  }
  $("save").addEventListener("click", () => showFeedback($("token").value.trim() ? "success" : "empty"));
  $("token").addEventListener("input", () => showFeedback(""));
  document.querySelectorAll("[data-feedback]").forEach((b) =>
    b.addEventListener("click", () => showFeedback(b.dataset.feedback)));

  function setBatch(value) {
    const next = Math.min(100, Math.max(1, Math.round(Number(value)) || 1));
    $("batch").value = next;
    $("batch-value").value = next;
    $("batch").style.setProperty("--fill", ((next - 1) / 99) * 100 + "%");
  }
  $("batch").addEventListener("input", (e) => setBatch(e.target.value));
  $("batch-value").addEventListener("change", (e) => setBatch(e.target.value));
  setBatch(4);

  document.querySelectorAll(".format").forEach((b) =>
    b.addEventListener("click", () =>
      document.querySelectorAll(".format").forEach((o) => o.setAttribute("aria-checked", String(o === b)))));
</script>
</body>
</html>
